# Example only - do NOT commit real credentials to source control.
# In a real cluster, create this via `kubectl create secret generic ...`,
# a secrets manager integration (e.g. External Secrets Operator), or your CI/CD
# pipeline's secret injection - never a checked-in YAML file with real values.
apiVersion: v1
kind: Secret
metadata:
  name: car-booking-db-credentials
type: Opaque
stringData:
  password: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: car-booking-auth-secrets
type: Opaque
stringData:
  # Base64-encoded, >=256-bit HMAC key for signing/validating this service's own JWTs
  # (self-issued - no external Identity Provider in this setup, see README Authentication
  # section). Generate a real one with: openssl rand -base64 32
  jwt-secret: "REPLACE_ME"
  # There's no real user store in scope for this assignment - see README. Replace with a
  # real one before this ever runs anywhere but a local/demo environment.
  demo-user-password: "REPLACE_ME"
