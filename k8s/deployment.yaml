apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-booking-service
  labels:
    app: car-booking-service
spec:
  # Safe to run multiple replicas now that state lives in a real shared PostgreSQL
  # database rather than an in-process H2 instance - all pods read/write the same data.
  replicas: 2
  selector:
    matchLabels:
      app: car-booking-service
  template:
    metadata:
      labels:
        app: car-booking-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: car-booking-service
          image: car-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            # Replace with the real Kafka broker/service address in the cluster
            # (e.g. a Strimzi-managed bootstrap service). "localhost" only makes
            # sense for a non-containerized local run.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.default.svc.cluster.local:9092"
            # Replace with the real credit-card-validation-service address in the cluster.
            - name: CREDIT_CARD_SERVICE_BASE_URL
              value: "http://credit-card-validation-service.default.svc.cluster.local"
            # Replace with the real PostgreSQL service address in the cluster
            # (e.g. a managed database, or an operator-managed StatefulSet).
            - name: DB_HOST
              value: "car-booking-postgres.default.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "car_booking"
            - name: DB_USERNAME
              value: "car_booking"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: car-booking-db-credentials
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: car-booking-auth-secrets
                  key: jwt-secret
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: car-booking-auth-secrets
                  key: demo-user-password
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
