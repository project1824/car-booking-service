{{- if .Values.secrets.create }}
# Only rendered when secrets.create=true (dev/uat default). Production sets this to
# false and expects a Secret of this exact name/key to already exist in the
# namespace, created by an External Secrets Operator or the Azure Key Vault CSI
# driver from the real vault instead - see README "Secrets in a real deployment".
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "car-booking-service.fullname" . }}-db-credentials
  labels:
    {{- include "car-booking-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.secrets.dbPassword | quote }}
{{- end }}
