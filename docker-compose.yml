services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: car-booking-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  postgres:
    image: postgres:16-alpine
    container_name: car-booking-postgres
    ports:
      # Host port 5433, not the default 5432 - avoids colliding with any
      # PostgreSQL already installed/running natively on the host machine.
      - "5433:5432"
    environment:
      POSTGRES_DB: car_booking
      POSTGRES_USER: car_booking
      POSTGRES_PASSWORD: car_booking
    volumes:
      - car-booking-postgres-data:/var/lib/postgresql/data

volumes:
  car-booking-postgres-data: