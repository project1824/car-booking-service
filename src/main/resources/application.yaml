server:
  port: 8082
spring:
  application:
    name: car-booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:car_booking}
    username: ${DB_USERNAME:car_booking}
    password: ${DB_PASSWORD:car_booking}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway (below) owns the schema now; Hibernate only validates its entity
      # mappings against what Flyway already created, catching a drift between the two
      # at startup instead of silently auto-altering the schema.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: car-booking-service
      auto-offset-reset: earliest
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
app:
  kafka:
    topics:
      bank-transfer-payment-events: bank-transfer-payment-events
  booking:
      cancellation:
        check-interval-ms: 300000
        window-hours: 48
  security:
    jwt:
      # Dev-only default (Base64, 256-bit) - MUST be overridden via JWT_SECRET in any
      # real deployment, exactly like the DB credentials below. Never commit a real one.
      secret: ${JWT_SECRET:D6Z4AXKRdMVfQ7RYcURfwkthRJoiZaL6scjIZsg34A4=}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    demo-user:
      # There's no real user store in scope for this assignment - one demo account
      # stands in for it. See README Authentication section.
      username: ${DEMO_USER_USERNAME:demo}
      password: ${DEMO_USER_PASSWORD:demo-password}
credit-card-validation-service:
  base-url: ${CREDIT_CARD_SERVICE_BASE_URL:http://localhost:9090/host/credit-card-payment-api}
resilience4j:
  retry:
    instances:
      creditCardValidation:
        # Kept small and bounded on purpose: a CREDIT_CARD booking holds a DB transaction
        # and a Postgres advisory lock open across this call (see BookingService), so each
        # retry attempt directly extends how long that lock is held.
        max-attempts: 3
        wait-duration: 300ms
        retry-exception-predicate: com.velocitymotors.carbooking.client.CreditCardTransientFailurePredicate
  circuitbreaker:
    instances:
      creditCardValidation:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exception-predicate: com.velocitymotors.carbooking.client.CreditCardTransientFailurePredicate
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-},%X{bookingId:-}] [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.velocitymotors.carbooking: INFO
    org.apache.kafka: WARN
    org.hibernate: WARN