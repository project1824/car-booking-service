server:
  port: 8082
spring:
  application:
    name: car-booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:car_booking}
    username: ${DB_USERNAME:car_booking}
    password: ${DB_PASSWORD:car_booking}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: car-booking-service
      auto-offset-reset: earliest
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
app:
  kafka:
    topics:
      bank-transfer-payment-events: bank-transfer-payment-events
  booking:
      cancellation:
        check-interval-ms: 300000
        window-hours: 48
credit-card-validation-service:
  base-url: ${CREDIT_CARD_SERVICE_BASE_URL:http://localhost:9090/host/credit-card-payment-api}
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-},%X{bookingId:-}] [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.velocitymotors.carbooking: INFO
    # Kafka's client libraries are extremely chatty at INFO (reconnects, rebalances,
    # metadata refreshes) - WARN keeps genuine problems visible without drowning them out.
    org.apache.kafka: WARN
    org.hibernate: WARN